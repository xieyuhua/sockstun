android.enableJetifier=true
android.useAndroidX=true

/* Explicit heap so the Gradle daemon does not blow up mid-build (a crash
   dumps a multi-hundred-MB java_pidNNN.hprof into the project root). CI /
   docker builds should also give the container at least 4 GB. */
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
