// ---------------------------------------------------------------------------
// 自动修正 SDK 路径（跨平台 / 跨容器安全，无需手动改 local.properties）。
//
// local.properties 里钉死的 sdk.dir（例如 Windows 的 D:\Android\Sdk）被挂到
// Linux 容器时目录并不存在，会让 AGP 拿它（失效）去覆盖 ANDROID_HOME，进而在
// mergeDebugResources 里因 SDK 路径解析失败抛 NullPointerException。
//
// 这里在配置前检测：sdk.dir 指向的目录若不存在，就删掉这一行，让 AGP 回退到
// ANDROID_HOME / ANDROID_SDK_ROOT。
//   - Windows 本机：路径存在 → 保留，行为完全不变（顺带忽略尾随空白）。
//   - Linux 容器：路径不存在 → 丢弃 → 用容器里有效的 ANDROID_HOME。
// ---------------------------------------------------------------------------
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    def original = localPropsFile.text
    def kept = new StringBuilder()
    def changed = false
    def replaced = false
    original.eachLine { line ->
        def matcher = line =~ /^\s*sdk\.dir\s*=\s*(.*)$/
        if (matcher.find()) {
            def path = matcher.group(1).trim()
            // 用普通 java.io.File 而不是 Gradle 的 file()：后者对含 ':' 的字符串
            // （Windows 盘符，如 D:/Android/Sdk）会当成 URL 去转换，在 Linux 容器里
            // 直接抛 "Cannot convert URL"，兜底逻辑自己先挂掉。File 对任何字符串
            // 都安全——Windows 盘符路径在 Linux 上只是"不存在"，走下面的分支。
            def f = new File(path)
            if (!f.absolute)
                f = new File(settingsDir, path)
            if (path.isEmpty() || !f.exists()) {
                // 路径在本机不存在 → 别直接丢，优先换成"去空白后的"环境路径：
                // 有些机器的 ANDROID_SDK_ROOT 自带尾随空白，AGP 原样解析会报
                // "Trailing char < >"。替换成有效路径后，Windows / Linux 容器
                // 共用这份文件时可以双向自愈（哪边的行失效就用哪边的环境补）。
                def env = (System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT'))?.trim()
                if (!replaced && env && new File(env).exists()) {
                    kept.append('sdk.dir=').append(env.replace('\\', '/')).append('\n')
                    replaced = true
                } else {
                    changed = true   // 没有可用的环境路径 → 真正丢弃这一行
                }
                return
            }
        }
        kept.append(line).append('\n')
    }
    if (changed || replaced) {
        localPropsFile.text = kept.toString()
    }
}

include ':app'
