// ---------------------------------------------------------------------------
// 自动修正 SDK 路径（跨平台 / 跨容器安全，无需手动改 local.properties）。
//
// local.properties 里钉死的 sdk.dir（例如 Windows 的 D:\Android\Sdk）被挂到
// Linux 容器时目录并不存在，会让 AGP 拿它（失效）去覆盖 ANDROID_HOME，进而在
// mergeDebugResources 里因 SDK 路径解析失败抛 NullPointerException。
//
// 这里在配置前检测：sdk.dir 指向的目录若不存在，就删掉这一行，让 AGP 回退到
// ANDROID_HOME / ANDROID_SDK_ROOT。
//   - Windows 本机：路径存在 → 保留，行为完全不变（顺带忽略尾随空白）。
//   - Linux 容器：路径不存在 → 丢弃 → 用容器里有效的 ANDROID_HOME。
// ---------------------------------------------------------------------------
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    def original = localPropsFile.text
    def kept = new StringBuilder()
    def changed = false
    original.eachLine { line ->
        def matcher = line =~ /^\s*sdk\.dir\s*=\s*(.*)$/
        if (matcher.find()) {
            def path = matcher.group(1).trim()
            if (path.isEmpty() || !file(path).exists()) {
                changed = true   // 路径无效（不存在或为空）→ 丢弃这一行
                return
            }
        }
        kept.append(line).append('\n')
    }
    if (changed) {
        localPropsFile.text = kept.toString()
    }
}

include ':app'
