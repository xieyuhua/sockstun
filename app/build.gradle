apply plugin: 'com.android.application'

/* 每次打包自动递增版本号（versionName += 0.01，versionCode += 1） */
def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
	versionProps.load(new FileInputStream(versionPropsFile))
} else {
	versionProps['VERSION_CODE'] = '12'
	versionProps['VERSION_NAME'] = '8.0'
}

def buildTaskNames = gradle.startParameter.taskNames
def isPackageBuild = buildTaskNames.any { name ->
	def n = name.toLowerCase()
	n.contains('assemble') || n.contains('bundle') || n.contains('build') || n.contains('install')
}

def pkgVersionCode = versionProps['VERSION_CODE'].toInteger()
def pkgVersionName = versionProps['VERSION_NAME'].toString()

if (isPackageBuild) {
	pkgVersionCode += 1
	pkgVersionName = new BigDecimal(pkgVersionName)
		.add(new BigDecimal('0.01')).setScale(2, java.math.RoundingMode.HALF_UP).toString()
	versionProps['VERSION_CODE'] = pkgVersionCode.toString()
	versionProps['VERSION_NAME'] = pkgVersionName
	versionProps.store(new FileOutputStream(versionPropsFile), 'Auto-managed version')
}

android {
	namespace "com.tunvpn"
	compileSdkVersion 34

	defaultConfig {
		applicationId "com.tunvpn"
		minSdkVersion 24
		targetSdkVersion 34
		versionCode pkgVersionCode
		versionName pkgVersionName
		ndk {
			/* libmihomo 只提供 arm64-v8a + armeabi-v7a；APK 的 ABI 要与内核实际提供的
			   保持一致，否则 Clash.load() 会找不到 .so。 */
			abiFilters "arm64-v8a", "armeabi-v7a"
		}
	}

	signingConfigs {
		release {
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
		debug {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
	}

	def propsFile = rootProject.file('store.properties')
	def configName = 'release'

	if (propsFile.exists() && android.signingConfigs.hasProperty(configName)) {
		def props = new Properties()
		props.load(new FileInputStream(propsFile))
		if (props!=null && props.containsKey('storeFile')) {
			android.signingConfigs[configName].storeFile = rootProject.file(props['storeFile'])
			android.signingConfigs[configName].storePassword = props['storePassword']
			android.signingConfigs[configName].keyAlias = props['keyAlias']
			android.signingConfigs[configName].keyPassword = props['keyPassword']
		}
	}

	/* 安装时必须**真的**把 .so 解压出来：Clash.load() 拿到的是
	   getApplicationInfo().nativeLibraryDir，只有 extractNativeLibs 最终为 true 时
	   那个目录里才会有这些 .so。useLegacyPackaging = true 就是这个意思，而且这里是
	   **唯一**该写它的地方 —— AGP 8 会忽略源码 manifest 里的 android:extractNativeLibs
	   （还会给出警告），而两处都留着会让 :app:packageDebug 在
	   PackageAndroidArtifact$IncrementalSplitterRunnable 里失败。
	   所以那个属性是**故意**从 AndroidManifest.xml 里移除的。 */
	packaging {
		jniLibs {
			useLegacyPackaging = true
		}
	}

	lintOptions {
		checkReleaseBuilds false
		// 另一种写法是：release 构建继续检查错误，但发现错误也继续构建：
		abortOnError false
	}

	dependenciesInfo {
		// 构建 APK 时不写入依赖元数据。
		includeInApk = false
		// 构建 Android App Bundle 时不写入依赖元数据。
		includeInBundle = false
	}
}

/* APK/AAB 文件名："<applicationId>-<versionName>"。
   archivesBaseName 已废弃（Gradle 9 会移除），替代品是 base 扩展的 archivesName。 */
base {
	archivesName = "${android.defaultConfig.applicationId}-${android.defaultConfig.versionName}"
}

/* ---------------------------------------------------------------------------
   内嵌内核 libmihomo（clash.meta）。

   这个库是以 GitHub Release 的 .aar 形式发布的（**不在** Maven Central）。
   我们把它下载（一次性）到 app/thirdparty/（**不是** app/libs/：AGP 会把
   app/libs/*.aar 自动当成依赖，并合并它的 res/ + manifest），然后**只解出**
   App 真正需要的东西，其余**故意**丢掉：
     - classes.jar            -> 编译/运行时 classpath（io.github.oviron.libmihomo.*）
     - jni/<abi>/*.so         -> 作为原生库打包（libmihomo.so 等）
     - (任意) libs/*.jar      -> 额外的 classpath jar
   AAR 里的 res/ 与 AndroidManifest.xml **刻意不合并**进 App：对一个无界面的 JNI
   内核来说它们毫无意义，而且实测合并它们会让 AGP 的资源合并器崩溃
   （mergeDebugResources 里抛 NullPointerException）。固定版本：v0.3.3 内含
   mihomo v1.19.30。许可：GPL-3.0（内嵌内核是静态链接的 Go 代码）。
--------------------------------------------------------------------------- */
def mihomoVersion = "0.3.3"
def mihomoAarName = "libmihomo-android-v${mihomoVersion}.aar"
def mihomoAar = file("${projectDir}/thirdparty/${mihomoAarName}")
def mihomoUrl = "https://github.com/oviron/libmihomo-android/releases/download/v${mihomoVersion}/${mihomoAarName}"
def mihomoExtractDir = file("${projectDir}/thirdparty/mihomo")
def mihomoClassesJar = file("${mihomoExtractDir}/classes.jar")
def mihomoJniDir = file("${mihomoExtractDir}/jni")
def mihomoExtraJars = []

/* A usable AAR: a real zip whose classes.jar ships io.github.oviron.libmihomo.Clash. */
def isUsableMihomoAar(File f) {
	if (f == null || !f.exists() || f.length() < 1024 * 1024) return false
	def tmp = File.createTempFile("mihomo_classes", ".jar")
	try {
		def zf = new java.util.zip.ZipFile(f)
		def ce = zf.getEntry("classes.jar")
		if (ce == null) { zf.close(); return false }
		tmp.withOutputStream { os -> os << zf.getInputStream(ce) }
		zf.close()
		def cj = new java.util.zip.ZipFile(tmp)
		def ok = cj.getEntry("io/github/oviron/libmihomo/Clash.class") != null
		cj.close()
		return ok
	} catch (Exception e) {
		return false
	} finally {
		tmp.delete()
	}
}

if (!isUsableMihomoAar(mihomoAar)) {
	if (mihomoAar.exists()) mihomoAar.delete()
	file("${projectDir}/thirdparty").mkdirs()
	println "Fetching libmihomo AAR (${mihomoAarName}) ..."
	def conn = new URL(mihomoUrl).openConnection()
	conn.instanceFollowRedirects = true
	conn.connect()
	if (conn.responseCode != 200) {
		throw new GradleException("Failed to download libmihomo AAR: HTTP ${conn.responseCode} " +
			"from ${mihomoUrl}. If this host cannot reach GitHub, download the AAR manually into ${mihomoAar}.")
	}
	mihomoAar.withOutputStream { os -> os << conn.inputStream }
	if (!isUsableMihomoAar(mihomoAar)) {
		mihomoAar.delete()
		throw new GradleException("Downloaded libmihomo AAR is invalid (missing " +
			"io.github.oviron.libmihomo.Clash). The release asset or package layout may have changed.")
	}
	println "libmihomo AAR ready: ${mihomoAar} (${mihomoAar.length()} bytes)"
}

/* 从 AAR 里解出 classes.jar、jni 原生库和它自带的 jar。
   只在需要时重新解（产物缺失，或 AAR 更新了）。 */
if (!mihomoClassesJar.exists() || mihomoAar.lastModified() > mihomoClassesJar.lastModified()) {
	if (mihomoExtractDir.exists()) mihomoExtractDir.deleteDir()
	mihomoExtractDir.mkdirs()
	mihomoJniDir.mkdirs()
	mihomoExtraJars = []
	def zf = new java.util.zip.ZipFile(mihomoAar)
	zf.entries().each { e ->
		if (e.directory) return
		if (e.name == "classes.jar") {
			mihomoClassesJar.withOutputStream { os -> os << zf.getInputStream(e) }
		} else if (e.name.startsWith("jni/")) {
			def rel = e.name.substring("jni/".length())
			def out = new File(mihomoJniDir, rel)
			out.parentFile.mkdirs()
			out.withOutputStream { os -> os << zf.getInputStream(e) }
		} else if (e.name.startsWith("libs/") && e.name.endsWith(".jar")) {
			def out = new File(mihomoExtractDir, e.name)
			out.parentFile.mkdirs()
			out.withOutputStream { os -> os << zf.getInputStream(e) }
			mihomoExtraJars << out
		}
	}
	zf.close()
	println "Extracted libmihomo: classes.jar + jni + ${mihomoExtraJars.size()} extra jar(s) -> ${mihomoExtractDir}"
}

/* 把解出来的原生库暴露给构建（在已有的 jniLibs 来源之外，例如 src/main/jniLibs）。 */
android.sourceSets.main.jniLibs.srcDirs += mihomoJniDir

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'com.google.android.material:material:1.12.0'
	implementation(files(mihomoClassesJar, *mihomoExtraJars))
}
