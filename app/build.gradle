apply plugin: 'com.android.application'

/* Auto increment version on each package build (versionName += 0.01, versionCode += 1) */
def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
	versionProps.load(new FileInputStream(versionPropsFile))
} else {
	versionProps['VERSION_CODE'] = '12'
	versionProps['VERSION_NAME'] = '8.0'
}

def buildTaskNames = gradle.startParameter.taskNames
def isPackageBuild = buildTaskNames.any { name ->
	def n = name.toLowerCase()
	n.contains('assemble') || n.contains('bundle') || n.contains('build') || n.contains('install')
}

def pkgVersionCode = versionProps['VERSION_CODE'].toInteger()
def pkgVersionName = versionProps['VERSION_NAME'].toString()

if (isPackageBuild) {
	pkgVersionCode += 1
	pkgVersionName = new BigDecimal(pkgVersionName)
		.add(new BigDecimal('0.01')).setScale(2, java.math.RoundingMode.HALF_UP).toString()
	versionProps['VERSION_CODE'] = pkgVersionCode.toString()
	versionProps['VERSION_NAME'] = pkgVersionName
	versionProps.store(new FileOutputStream(versionPropsFile), 'Auto-managed version')
}

android {
	namespace "hev.sockstun"
	compileSdkVersion 34

	defaultConfig {
		applicationId "hev.sockstun"
		minSdkVersion 24
		targetSdkVersion 34
		versionCode pkgVersionCode
		versionName pkgVersionName
		setProperty("archivesBaseName", "$applicationId-$versionName")
		ndk {
			/* libmihomo ships arm64-v8a + armeabi-v7a; keep the APK aligned to
			   what the core actually provides so Clash.load() never misses a .so. */
			abiFilters "arm64-v8a", "armeabi-v7a"
		}
	}

	signingConfigs {
		release {
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
		debug {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
	}

	def propsFile = rootProject.file('store.properties')
	def configName = 'release'

	if (propsFile.exists() && android.signingConfigs.hasProperty(configName)) {
		def props = new Properties()
		props.load(new FileInputStream(propsFile))
		if (props!=null && props.containsKey('storeFile')) {
			android.signingConfigs[configName].storeFile = rootProject.file(props['storeFile'])
			android.signingConfigs[configName].storePassword = props['storePassword']
			android.signingConfigs[configName].keyAlias = props['keyAlias']
			android.signingConfigs[configName].keyPassword = props['keyPassword']
		}
	}

	lintOptions {
		checkReleaseBuilds false
		// Or, if you prefer, you can continue to check for errors in release builds,
		// but continue the build even when errors are found:
		abortOnError false
	}

	dependenciesInfo {
		// Disables dependency metadata when building APKs.
		includeInApk = false
		// Disables dependency metadata when building Android App Bundles.
		includeInBundle = false
	}
}

/* ---------------------------------------------------------------------------
   libmihomo (clash.meta) embedded core.

   The library is published as a GitHub Release .aar (not on Maven Central), so
   we download it once into app/build/libs (git-ignored) and consume it through
   a flatDir repository. Pin the exact version: v0.3.3 bundles mihomo v1.19.30.
   A network connection is required on the first build (or after a clean).
   License: GPL-3.0 (the embedded core is statically linked Go code).

   We use a flatDir repo + `name/ext` (instead of `files(.aar)`) because AGP
   reliably extracts the AAR's classes.jar / jniLibs only via repository
   resolution, and defers lookup to execution time so the task-produced file
   is present when the classpath is computed.
--------------------------------------------------------------------------- */
def mihomoVersion = "0.3.3"
def mihomoAarName = "libmihomo-android-v${mihomoVersion}.aar"
def mihomoAar = file("$buildDir/libs/${mihomoAarName}")

task downloadMihomo {
	outputs.file(mihomoAar)
	doLast {
		/* Re-download if missing or suspiciously small (e.g. a stale/bad file
		   left over from a previous failed attempt). */
		def need = !mihomoAar.exists() || mihomoAar.length() < 1024 * 1024
		if (need) {
			if (mihomoAar.exists()) mihomoAar.delete()
			mihomoAar.parentFile.mkdirs()
			def url = "https://github.com/oviron/libmihomo-android/releases/download/v${mihomoVersion}/${mihomoAarName}"
			def conn = new URL(url).openConnection()
			conn.instanceFollowRedirects = true
			conn.connect()
			def code = conn.responseCode
			if (code != 200) {
				throw new GradleException("Download mihomo AAR failed: HTTP ${code} from ${url}")
			}
			mihomoAar.withOutputStream { os -> os << conn.inputStream }
			if (mihomoAar.length() < 1024 * 1024) {
				mihomoAar.delete()
				throw new GradleException("Downloaded mihomo AAR is suspiciously small " +
					"(${mihomoAar.length()} bytes); the release asset/URL may have changed.")
			}
			println "Downloaded ${mihomoAarName} (${mihomoAar.length()} bytes)"
		}
	}
}

repositories {
	flatDir { dirs mihomoAar.parentFile }
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.0'
	implementation 'com.google.android.material:material:1.12.0'
	implementation(name: mihomoAarName.replace('.aar', ''), ext: 'aar') { builtBy downloadMihomo }
}

/* Make sure the AAR exists before the build's pre-build phase. */
preBuild.dependsOn downloadMihomo
