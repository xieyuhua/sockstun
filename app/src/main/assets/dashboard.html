<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tunVPN 控制台</title>
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#0f1115;color:#e6e6e6}
 header{padding:12px 16px;background:#171a21;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
 h1{font-size:16px;margin:0}
 .sub{font-size:12px;color:#9aa}
 main{padding:12px 16px}
 .card{background:#171a21;border-radius:10px;padding:12px;margin-bottom:12px}
 .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #23262e;font-size:14px;gap:8px}
 .row:last-child{border-bottom:0}
 select{background:#0f1115;color:#e6e6e6;border:1px solid #2a2e38;border-radius:6px;padding:6px;min-width:150px;max-width:55%}
 button{background:#2b6cff;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
 button.ghost{background:#262b36}
 .muted{color:#9aa;font-size:12px;line-height:1.6}
 .ok{color:#4caf50}.bad{color:#ff5b5b}
</style>
</head>
<body>
<header><h1>tunVPN 控制台</h1><span class="sub" id="ver"></span></header>
<main>
 <div class="card">
   <div class="row"><span>模式</span><span id="mode">-</span></div>
   <div class="row"><span>上行 / 下行</span><span id="traffic">0 / 0</span></div>
   <div class="row"><span>活跃连接</span><span id="conns">0</span></div>
 </div>
 <div class="card" id="groups"><span class="muted">加载中…</span></div>
 <div class="muted">控制台由 App 内嵌 clash-api 提供（端口 9090）。切换节点即时生效；"测速"经当前节点实测延迟。</div>
</main>
<script>
const TOKEN = "{{TOKEN}}";
const H = {Authorization:"Bearer "+TOKEN};
function fmt(n){if(n==null)return"0";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(2)+" GB";}
async function getJSON(p){const r=await fetch(p,{headers:H});if(!r.ok)throw new Error(r.status);return r.json();}
async function tick(){
 try{
  const v=await getJSON('/version'); document.getElementById('ver').textContent=v.version||'';
  const c=await getJSON('/connections');
  document.getElementById('conns').textContent=(c.connections||[]).length;
  document.getElementById('traffic').textContent=fmt(c.upload)+' / '+fmt(c.download);
  const p=await getJSON('/proxies');
  let html='';
  for(const name in p.proxies){
    const g=p.proxies[name];
    if(g.type==='Selector'||g.type==='URLTest'||g.type==='Fallback'){
      html+='<div class="row"><span>'+name+'</span><span><select data-g="'+encodeURIComponent(name)+'">';
      for(const m of (g.all||[])) html+='<option value="'+m+'"'+(m===g.now?' selected':'')+'>'+m+'</option>';
      html+='</select> <button class="ghost" data-test="'+encodeURIComponent(name)+'">测速</button></span></div>';
    }
  }
  const el=document.getElementById('groups'); el.innerHTML=html||'<span class="muted">无可切换的代理组</span>';
  el.querySelectorAll('select').forEach(s=>s.onchange=async e=>{
    const g=decodeURIComponent(e.target.dataset.g), n=e.target.value;
    await fetch('/proxies/'+encodeURIComponent(g),{method:'PUT',headers:H,body:JSON.stringify({name:n})});
  });
  el.querySelectorAll('button[data-test]').forEach(b=>b.onclick=async e=>{
    const g=decodeURIComponent(e.target.dataset.test);
    try{await fetch('/proxies/'+encodeURIComponent(g)+'/delay?url=https://www.gstatic.com/generate_204&timeout=5000',{method:'POST',headers:H});}catch(_){}
    tick();
  });
  try{const cfg=await getJSON('/configs');document.getElementById('mode').textContent=cfg.mode||'-';}catch(_){}
 }catch(e){document.getElementById('ver').textContent='连接失败: '+e.message;}
}
tick(); setInterval(tick,2500);
</script>
</body>
</html>
