/* 根构建脚本：在 buildscript 的 classpath 上声明 Android Gradle Plugin，
   供 :app 模块使用，并声明所有模块解析依赖所用的仓库。
   **不要**把本文件的内容覆盖成 app/build.gradle —— 根脚本的 classpath 上没有 AGP，
   所以第 1 行写 "apply plugin: 'com.android.application'" 会让 Gradle 报
   "Plugin with id 'com.android.application' not found"。 */

/* buildscript 块配置的是 Gradle **自身**（构建时）要用的仓库和依赖，
   也就是插件；各个模块的依赖不放这里。 */

buildscript {

	/* 从 Maven Central 与 Google 的 Maven 仓库解析插件依赖。
	   （Android Studio 模板里那段"使用 JCenter"是旧内容：JCenter 早已停服。） */

	repositories {
		mavenCentral()
		google()
	}

	/* 把 Android Gradle Plugin 作为 classpath 依赖引入（当前版本见下一行，
	   模板注释里写的 2.3.1 早已过时）。 */

	dependencies {
		classpath 'com.android.tools.build:gradle:8.4.1'
	}
}

/* allprojects 配置的是**所有模块共用**的仓库和依赖；
   只有某个模块需要的依赖，应写在那个模块自己的 build.gradle 里。 */

allprojects {
	repositories {
		google()
		mavenCentral()
	}
}
